site_name: TooGoodToGo Auto
site_url: https://github.com/miachillgood/toogoodtogo-auto
site_description: >-
  An unofficial CLI that monitors Too Good To Go surprise bags, sends
  notifications, and optionally completes checkout.
site_author: TooGoodToGo Auto contributors
repo_url: https://github.com/miachillgood/toogoodtogo-auto
repo_name: miachillgood/toogoodtogo-auto
copyright: © Peter Schwips

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Geist
    code: Geist Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    scheme: default
    primary: black
    accent: grey

extra_css:
  - css/extra.css

plugins:
  - search
  - privacy
  - social
  - llmstxt:
      markdown_description: >-
        TooGoodToGo Auto is an unofficial cross-platform command-line app that
        monitors surprise bags, sends availability notifications, and can
        optionally complete checkout, including supported 3DS flows.
      sections:
        Documentation:
          - "*.md"

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/miachillgood/toogoodtogo-auto
      name: TooGoodToGo Auto on GitHub

nav:
  - Home: index.md
  - Installation: installation.md
  - Quick Start: quickstart.md
  - Configuration: configuration.md
  - Credit Cards: credit-cards.md
  - FAQ: faq.md
  - Disclaimer: disclaimer.md
